name: Compatibility release gate

on:
  pull_request:
    paths:
      - 'release/**'
      - 'devx/**'
      - 'frontend/**'
      - 'backend/**'
      - 'contracts/**'
      - 'zk/**'
      - '.github/labels.yml'
      - '.github/labeler.yml'
      - '.github/workflows/release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'devx/**'
      - 'frontend/**'
      - 'backend/**'
      - 'contracts/**'
      - 'zk/**'
      - '.github/labels.yml'
      - '.github/labeler.yml'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Verify atomic release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manifest and digests
        run: python3 devx/release_guard.py
      - name: Publish cross-layer compatibility report
        run: |
          python3 devx/compatibility_report.py --write --stable --check
          python3 devx/compatibility_report.py --verify-existing --stable --check
      - name: Validate label taxonomy
        run: |
          pip install pyyaml --quiet
          python3 devx/label_config.py --check .github/labels.yml
          python3 devx/label_config.py --check-labeler \
            .github/labeler.yml .github/labels.yml
      - name: Exercise negative release-gate paths
        run: python3 -m unittest discover -s devx -p 'test_*.py' -v
